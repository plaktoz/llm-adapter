[project]
name = "llm-adapter"
version = "0.0.0"
description = "In-process Python library: one interface for calling LLMs across providers, with retry, failover and usage reporting."
readme = "README.md"
requires-python = ">=3.11"
# Provider SDKs are added with the adapter tasks, with their versions pinned then.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
